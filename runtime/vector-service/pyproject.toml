[project]
name = "dooknow-vector-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "sentence-transformers==6.1.0", "numpy==2.5.4", "jieba==0.42.1", "tokenizers==0.23.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
markers = ["model: requires the explicitly prepared real local BGE model"]
