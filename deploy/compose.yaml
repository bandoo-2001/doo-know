services:
  notes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
      KNOWLEDGE_ROOT: /knowledge
      DATA_ROOT: /data
      AUTH_SECRET_FILE: /run/secrets/auth.key
      APP_ORIGIN: "${APP_ORIGIN:?set HTTPS public origin}"
    volumes:
      - "${KNOWLEDGE_ROOT:?set intended knowledge path}:/knowledge"
      - "${DATA_ROOT:?set persistent data path}:/data"
      - "${AUTH_SECRET_FILE:?set protected secret file}:/run/secrets/auth.key:ro"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
