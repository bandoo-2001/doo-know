name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/install-launcher.test.ts tests/install-template.test.ts tests/account-prompt.test.ts tests/auth.test.ts tests/platform-cli.test.ts tests/platform-config.test.ts tests/platform-update.test.ts tests/github-publish.test.ts tests/release-verification.test.ts tests/maintenance-storage.test.ts tests/backup-reconciliation.test.ts tests/knowledge/snapshot-lifecycle.test.ts
      - run: npm run build
